[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = hard_disk_potential
samplers = pressure_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 1.0
number_of_equilibration_iterations = 100000
number_of_observations = 100000
normalised_distance_between_measurements = 1.0
output_directory = output/hard_disk_tests/eight_particles_preliminary

[HardDiskPotential]
disk_radius = 1.0
packing_fraction = 0.656

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 6.18967734

[PressureSampler]

[ModelSettings]
number_of_particles = 8
dimensionality_of_particle_space = 2
