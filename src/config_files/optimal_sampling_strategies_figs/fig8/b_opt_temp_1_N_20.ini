[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = polynomial_potential
samplers = half_system_distance_variance_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 1.0
number_of_equilibration_iterations = 0
number_of_observations = 200000
normalised_distance_between_measurements = 0.001
initial_active_particle_index = 19
output_directory = output/optimal_sampling_strategies_figs/fig8/b_opt_temp_1_N_20

[PolynomialPotential]
powers = 2.0
prefactors = 0.5
factor_field_prefactor = 2.0
cell_horizon = 1.0

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 10000000000.0

[HalfSystemDistanceVarianceSampler]

[EventStepSampler]

[EventParticlePositionSampler]

[EventActiveParticleIndexSampler]

[ModelSettings]
number_of_particles = 20
size_of_particle_space = 40.0
range_of_initial_particle_positions = config_files/optimal_sampling_strategies_figs/initial_positions/N20_L40.txt
