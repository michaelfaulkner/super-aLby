[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = harmonic_chain_potential
samplers = half_system_distance_variance_sampler, event_step_sampler, event_particle_position_sampler, event_active_particle_index_sampler, event_distance_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 0.000001
number_of_equilibration_iterations = 0
number_of_observations = 200
normalised_distance_between_measurements = 0.1
initial_active_particle_index = 7
output_directory = output/optimal_sampling_strategies_figs/fig6/b0

[HarmonicChainPotential]
equilibrium_length = 0.0
use_cell_horizon = False

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 10000000000.0

[HalfSystemDistanceVarianceSampler]

[EventStepSampler]

[EventParticlePositionSampler]

[EventActiveParticleIndexSampler]

[ModelSettings]
number_of_particles = 8
size_of_particle_space = 16.0
range_of_initial_particle_positions = config_files/optimal_sampling_strategies_figs/initial_positions/N8_L16.txt