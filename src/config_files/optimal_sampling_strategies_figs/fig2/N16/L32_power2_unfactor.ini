[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = unfactorised_harmonic_chain_potential
samplers = structure_factor_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 1.0
number_of_equilibration_iterations = 350000
number_of_observations = 500000
output_directory = output/optimal_sampling_strategies_figs/fig2/N16/L32_power2_unfactor
normalised_distance_between_measurements = 0.5

[UnfactorisedHarmonicChainPotential]
equilibrium_length = 2.0

[StructureFactorSampler]

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 10000000000.0

[ModelSettings]
number_of_particles = 16
size_of_particle_space = 32.0
range_of_initial_particle_positions = [0.0, 32.0]
