[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = polynomial_potential
samplers = structure_factor_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 1.0
number_of_equilibration_iterations = 600000
number_of_observations = 1250000
normalised_distance_between_measurements = 0.5
output_directory = output/optimal_sampling_strategies_figs/fig2/N96/L192_power2

[PolynomialPotential]
powers = 2.0
prefactors = 0.5
factor_field_prefactor = 0.0
cell_horizon = 1.0

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 100000000.0

[StructureFactorSampler]

[ModelSettings]
number_of_particles = 96
dimensionality_of_particle_space = 1
size_of_particle_space = 192.0
range_of_initial_particle_positions = [0.0, 192.0]
