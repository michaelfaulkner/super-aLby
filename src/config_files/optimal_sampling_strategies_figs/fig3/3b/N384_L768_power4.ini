[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = polynomial_potential
samplers = structure_factor_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 1.0
number_of_equilibration_iterations = 50000
number_of_observations = 200000
normalised_distance_between_measurements = 0.5
output_directory = output/optimal_sampling_strategies_figs/fig3/3b/N384_L768_power4

[PolynomialPotential]
powers = 4.0
prefactors = 0.25
factor_field_prefactor = 8.48
cell_horizon = 0.3

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 100000000.0

[StructureFactorSampler]

[ModelSettings]
number_of_particles = 384
dimensionality_of_particle_space = 1
size_of_particle_space = 768.0
range_of_initial_particle_positions = [0.0, 768.0]
