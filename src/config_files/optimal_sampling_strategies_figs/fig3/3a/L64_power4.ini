[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = polynomial_potential
samplers = structure_factor_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 1.0
number_of_equilibration_iterations = 200000
number_of_observations = 400000
normalised_distance_between_measurements = 0.5
output_directory = output/optimal_sampling_strategies_figs/fig3/3a/L64_power4

[PolynomialPotential]
powers = 4.0
prefactors = 0.25
factor_field_prefactor = 64.0
cell_horizon = 0.165

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 100000000.0

[StructureFactorSampler]

[ModelSettings]
number_of_particles = 16
dimensionality_of_particle_space = 1
size_of_particle_space = 64.0
range_of_initial_particle_positions = [0.0, 64.0]
