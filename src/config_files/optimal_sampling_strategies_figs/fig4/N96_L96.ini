[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = soft_disk_potential
samplers = structure_factor_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 0.1
number_of_equilibration_iterations = 600000
number_of_observations = 5800000
normalised_distance_between_measurements = 0.01
output_directory = output/optimal_sampling_strategies_figs/fig4/N96_L96

[SoftDiskPotential]
use_cell_horizon = True
factor_field_prefactor = 0.0
sigma = 0.75
power = 2.0

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 100000000.0

[StructureFactorSampler]

[ModelSettings]
number_of_particles = 96
dimensionality_of_particle_space = 1
size_of_particle_space = 96.0
range_of_initial_particle_positions = [0.0, 96.0]
