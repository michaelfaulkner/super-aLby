[Run]
mediator = event_chain_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[EventChainMediator]
potential = one_dim_quantum_oscillator_potential
samplers = standard_position_sampler, mean_squared_position_sampler
noise_distribution = gaussian_noise_distribution
minimum_temperature = 1.0
maximum_temperature = 1.0
number_of_temperature_increments = 0
number_of_equilibration_iterations = 100
number_of_observations = 10000
proposal_dynamics_adaptor_is_on = False
distance_between_measurements = 0.1
speed_of_chain = 1.0

[OneDimQuantumOscillatorPotential]
dimensionless_mass = 0.1
timestep = 0.1

[StandardPositionSampler]
output_directory = output/event_chain_mediator/l_01

[MeanSquaredPositionSampler]
output_directory = output/event_chain_mediator/l_01


[GaussianNoiseDistribution]

[ModelSettings]
number_of_particles = 1000
size_of_particle_space = 1
range_of_initial_particle_positions = [-1, 1]