[Run]
mediator = event_chain_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[EventChainMediator]
potential = quantum_harmonic_oscillator_potential
samplers = mean_squared_position_sampler
minimum_temperature = 1.0
maximum_temperature = 1.0
number_of_temperature_increments = 0
number_of_equilibration_iterations = 1000
number_of_observations = 6000
distance_between_measurements = 15.0

[QuantumHarmonicOscillatorPotential]
mass = 1.0
timestep = 0.1

[MeanSquaredPositionSampler]
output_directory = output/event_chain_mediator/01


[ModelSettings]
number_of_particles = 1200
size_of_particle_space = 1
range_of_initial_particle_positions = 0.0