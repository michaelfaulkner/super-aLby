[Run]
mediator = event_chain_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[EventChainMediator]
potential = xy_potential
samplers = xy_magnetisation_norm_sampler
minimum_temperature = 1.6
maximum_temperature = 1.6
number_of_temperature_increments = 0
number_of_equilibration_iterations = 8000
number_of_observations = 80000
normalised_distance_between_measurements = 1.0
distance_between_velocity_refreshments = 0.239502662
teleportation_portal = true

[XyPotential]

[XyMagnetisationNormSampler]
output_directory = output/xy_potential/event_chain/portal/refresh_dist/16x16/high_temp_2/event_chain_teleportation_portal_16x16_high_temp_2_10/job_02

[ModelSettings]
number_of_particles = 256
size_of_particle_space = 6.28318530718
range_of_initial_particle_positions = [0.0, 6.28318530718]

