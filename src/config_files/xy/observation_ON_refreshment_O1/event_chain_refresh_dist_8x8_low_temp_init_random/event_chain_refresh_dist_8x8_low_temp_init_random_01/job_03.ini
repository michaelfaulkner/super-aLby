[Run]
mediator = event_chain_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[EventChainMediator]
potential = xy_potential
samplers = xy_magnetisation_norm_sampler
minimum_temperature = 0.8
maximum_temperature = 0.8
number_of_temperature_increments = 0
number_of_equilibration_iterations = 2000
number_of_observations = 20000
normalised_distance_between_measurements = 1.0
distance_between_velocity_refreshments = 0.1407055989

[XyPotential]

[XyMagnetisationNormSampler]
output_directory = output/xy_potential/event_chain/refresh_dist/8x8/low_temp_init_random/event_chain_refresh_dist_8x8_low_temp_init_random_01/job_03

[ModelSettings]
number_of_particles = 64
size_of_particle_space = 6.28318530718
range_of_initial_particle_positions = [0.0, 6.28318530718]

