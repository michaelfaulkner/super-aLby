[Run]
mediator = metropolis_mediator

[MetropolisMediator]
potential = hard_disk_potential
samplers = structure_factor_sampler
noise_distribution = toroidal_uniform_noise_distribution
temperature = 1.0
number_of_equilibration_iterations = 10000
number_of_observations = 100000
proposal_dynamics_adaptor_is_on = True
output_directory = output/hard_disks/metropolis

[HardDiskPotential]
disk_radius = 1.0
packing_fraction = 0.5

[ToroidalUniformNoiseDistribution]

[StructureFactorSampler]

[ModelSettings]
number_of_particles = 12
dimensionality_of_particle_space = 1
