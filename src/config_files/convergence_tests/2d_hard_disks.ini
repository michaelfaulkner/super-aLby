[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = hard_disk_potential
samplers = pressure_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 1.0
number_of_equilibration_iterations = 2000
number_of_observations = 5000
normalised_distance_between_measurements = 1.0
output_directory = output/convergence_tests/2d_hard_disk_potential

[HardDiskPotential]
disk_radius_a = 1.0
disk_radius_b = 1.0
packing_fraction = 0.515

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 7.409562685405

[PressureSampler]

[ModelSettings]
number_of_particles = 9
dimensionality_of_particle_space = 2