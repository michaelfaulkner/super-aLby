[Run]
mediator = metropolis_mediator

[MetropolisMediator]
potential = tethered_harmonic_chain_potential
samplers = structure_factor_sampler
noise_distribution = unbounded_uniform_noise_distribution
temperature = 1.0
number_of_equilibration_iterations = 50000
number_of_observations = 300000
proposal_dynamics_adaptor_is_on = True
output_directory = output/tethered_harmonic_chain/metropolis

[TetheredHarmonicChainPotential]

[StructureFactorSampler]

[UnboundedUniformNoiseDistribution]

[ModelSettings]
number_of_particles = 8
size_of_particle_space = 9.0
range_of_initial_particle_positions = [0.0, 9.0]
