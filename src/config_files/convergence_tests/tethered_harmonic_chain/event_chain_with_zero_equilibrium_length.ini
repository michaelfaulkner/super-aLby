[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = tethered_harmonic_chain_potential
samplers = structure_factor_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 1.0
number_of_equilibration_iterations = 50000
number_of_observations = 200000
output_directory = output/tethered_harmonic_chain/event_chain_with_zero_equilibrium_length

[TetheredHarmonicChainPotential]
equilibrium_length = 0.0

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 1000000000

[StructureFactorSampler]

[ModelSettings]
number_of_particles = 8
size_of_particle_space = 9.0
range_of_initial_particle_positions = [0.0, 9.0]
