[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = soft_disk_potential
samplers = structure_factor_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 1.0
number_of_equilibration_iterations = 30000
number_of_observations = 50000
normalised_distance_between_measurements = 1.0
output_directory = output/convergence_tests/1d_soft_disks/event_chain

[SoftDiskPotential]
use_cell_horizon = True
factor_field_prefactor = 1.0

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 100000000.0

[StructureFactorSampler]

[ModelSettings]
number_of_particles = 8
dimensionality_of_particle_space = 1
size_of_particle_space = 16.0
range_of_initial_particle_positions = [0.0, 16.0]
