[Run]
mediator = metropolis_mediator

[MetropolisMediator]
potential = soft_disk_potential
samplers = structure_factor_sampler
noise_distribution = unbounded_uniform_noise_distribution
temperature = 1.0
number_of_equilibration_iterations = 75000
number_of_observations = 250000
proposal_dynamics_adaptor_is_on = True
output_directory = output/convergence_tests/1d_soft_disks/metropolis

[SoftDiskPotential]
cutoff = 10000.0

[StructureFactorSampler]

[UnboundedUniformNoiseDistribution]

[ModelSettings]
number_of_particles = 8
size_of_particle_space = 16.0
range_of_initial_particle_positions = [0.0, 16.0]
