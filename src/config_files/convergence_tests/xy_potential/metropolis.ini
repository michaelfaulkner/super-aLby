[Run]
mediator = metropolis_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[MetropolisMediator]
potential = xy_potential
samplers = standard_mean_position_sampler
noise_distribution = gaussian_noise_distribution
minimum_temperature = 2.0
maximum_temperature = 2.0
number_of_temperature_increments = 0
number_of_equilibration_iterations = 10000
number_of_observations = 100000
proposal_dynamics_adaptor_is_on = False # check what this means

[XyPotential]

[StandardMeanPositionSampler]
output_directory = output/convergence_tests/xy_potential/metropolis

[GaussianNoiseDistribution]

[ModelSettings]
number_of_particles = 16
size_of_particle_space = 2
range_of_initial_particle_positions = 0