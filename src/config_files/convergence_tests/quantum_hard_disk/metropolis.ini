[Run]
mediator = metropolis_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[MetropolisMediator]
potential = quantum_hard_disk_potential
samplers = standard_position_sampler
noise_distribution = gaussian_noise_distribution
minimum_temperature = 1.0
maximum_temperature = 1.0
number_of_temperature_increments = 0
number_of_equilibration_iterations = 30000
number_of_observations = 50000
proposal_dynamics_adaptor_is_on = True

[QuantumHardDiskPotential]
mass = 0.8
timestep = 1.0
disk_radius = 0.5

[StandardPositionSampler]
output_directory = output/convergence_tests/quantum_hard_disk_potential/metropolis

[GaussianNoiseDistribution]

[ModelSettings]
number_of_timeslices = 2
number_of_quantum_particles = 19
size_of_particle_space = 20.0
range_of_initial_particle_positions = [-10.0, 10.0]
toroidal_geometry = True
