[Run]
mediator = event_chain_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[EventChainMediator]
potential = quantum_hard_disk_potential
samplers = standard_position_sampler
minimum_temperature = 1.0
maximum_temperature = 1.0
number_of_temperature_increments = 0
number_of_equilibration_iterations = 1000
number_of_observations = 50000
normalised_distance_between_measurements = 0.0037

[QuantumHardDiskPotential]
mass = 0.8
timestep = 1.0
disk_radius = 0.5

[StandardPositionSampler]
output_directory = output/convergence_tests/quantum_hard_disk_potential/event_chain

[ModelSettings]
number_of_timeslices = 30
number_of_quantum_particles = 9
size_of_particle_space = 10.0
range_of_initial_particle_positions = [-5.0, 5.0]
toroidal_geometry = True
