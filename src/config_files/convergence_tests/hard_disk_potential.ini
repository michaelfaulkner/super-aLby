[Run]
mediator = event_chain_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[EventChainMediator]
potential = hard_disk_potential
samplers = pressure_sampler
minimum_temperature = 1.0
maximum_temperature = 1.0
number_of_temperature_increments = 0
number_of_equilibration_iterations = 1000
number_of_observations = 10000
distance_between_measurements = 1.0

[HardDiskPotential]
disk_radius = 0.1
packing_fraction = 0.6

[PressureSampler]
output_directory = output/convergence_tests/hard_disk_potential

[ModelSettings]
number_of_particles = 8
