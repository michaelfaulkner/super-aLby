[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = quantum_harmonic_oscillator_potential
samplers = mean_squared_position_sampler
temperature = 1.0
number_of_equilibration_iterations = 10000
number_of_observations = 30000
normalised_distance_between_measurements = 1.6666
output_directory = output/convergence_tests/quantum_anharmonic_oscillator_potential/event_chain

[QuantumHarmonicOscillatorPotential]
mass = 0.5
timestep = 1.0
anharmonicity = 1.0
omega_squared = -20.0

[MeanSquaredPositionSampler]


[ModelSettings]
number_of_quantum_particles = 1
number_of_timeslices = 50
size_of_particle_space = 1
range_of_initial_particle_positions = 1.37
