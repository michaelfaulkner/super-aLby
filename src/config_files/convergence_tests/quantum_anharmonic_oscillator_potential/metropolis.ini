[Run]
mediator = metropolis_mediator

[MetropolisMediator]
potential = quantum_harmonic_oscillator_potential
samplers = mean_squared_position_sampler
noise_distribution = unbounded_gaussian_noise_distribution
temperature = 1.0
number_of_equilibration_iterations = 20000
number_of_observations = 10000
proposal_dynamics_adaptor_is_on = True
output_directory = output/convergence_tests/quantum_anharmonic_oscillator_potential/metropolis

[QuantumHarmonicOscillatorPotential]
mass = 0.5
timestep = 0.5
anharmonicity = 1.0
omega_squared = -2.0

[MeanSquaredPositionSampler]

[UnboundedGaussianNoiseDistribution]

[ModelSettings]
number_of_quantum_particles = 1
number_of_timeslices = 50
size_of_particle_space = 1
range_of_initial_particle_positions = 0.5
