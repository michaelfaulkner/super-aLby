[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = hard_disk_potential
samplers = structure_factor_sampler
factor_field = hard_disk_factor_field
refreshment_distribution = uniform_refreshment_distribution
temperature = 1.0
number_of_equilibration_iterations = 10000
number_of_observations = 20000
normalised_distance_between_measurements = 1.0
output_directory = output/ecmc/reference
portal_probability = 1.0

[HardDiskPotential]
disk_radius_a = 1.0
disk_radius_b = 2.0
particle_ratio_a = 1
particle_ratio_b = 1
packing_fraction = 0.5

[HardDiskFactorField]
prefactor = 1
ff_type = no
disk_radius_a = 1.0
disk_radius_b = 2.0
particle_ratio_a = 1
particle_ratio_b = 1

[UniformRefreshmentDistribution]

[StructureFactorSampler]

[ModelSettings]
number_of_particles = 10
dimensionality_of_particle_space = 1
