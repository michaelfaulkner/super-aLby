[Run]
mediator = metropolis_mediator

[MetropolisMediator]
potential = hard_disk_potential
samplers = structure_factor_sampler
noise_distribution = toroidal_uniform_noise_distribution
temperature = 1.0
number_of_equilibration_iterations = 100000
number_of_observations = 200000
proposal_dynamics_adaptor_is_on = True
output_directory = output/convergence_tests/1d_hard_disk_binary/metropolis
particle_swap = True

[HardDiskPotential]
disk_radius_a = 1.0
disk_radius_b = 2.0
particle_ratio
packing_fraction = 0.8

[ToroidalUniformNoiseDistribution]

[StructureFactorSampler]

[ModelSettings]
number_of_particles = 8
dimensionality_of_particle_space = 1
