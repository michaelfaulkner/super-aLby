[Run]
mediator = event_chain_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[EventChainMediator]
potential = quantum_harmonic_oscillator_potential
samplers = mean_squared_position_sampler
factor_field = temporal_factor_field
temperature = 1.0
number_of_equilibration_iterations = 1000
number_of_observations = 10000
normalised_distance_between_measurements = 1.666
output_directory = output/convergence_tests/quantum_harmonic_oscillator_potential/event_chain_with_factor_fields

[QuantumHarmonicOscillatorPotential]
mass = 0.8
timestep = 1.5
omega_squared = 0.64
cpp_implementation = True

[TemporalFactorField]
prefactor = 1.0

[MeanSquaredPositionSampler]

[ModelSettings]
number_of_quantum_particles = 1
number_of_timeslices = 30
size_of_particle_space = 1
range_of_initial_particle_positions = 0.0
