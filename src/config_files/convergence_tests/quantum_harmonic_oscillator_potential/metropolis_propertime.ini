[Run]
mediator = metropolis_mediator

[MetropolisMediator]
potential = quantum_harmonic_oscillator_potential
samplers = mean_squared_position_sampler, standard_position_sampler, auxillary_particle_sampler
noise_distribution = unbounded_gaussian_noise_distribution
temperature = 1.0
number_of_equilibration_iterations = 10000
number_of_observations = 50000
proposal_dynamics_adaptor_is_on = False
output_directory = output/convergence_tests/quantum_harmonic_oscillator_potential/metropolis_proper_time_integral
auxillary_particle = True

[QuantumHarmonicOscillatorPotential]
mass = 0.8
timestep = 0.05
omega_squared = 0.64
cpp_implementation = False

[MeanSquaredPositionSampler]

[StandardPositionSampler]

[AuxillaryParticleSampler]

[UnboundedGaussianNoiseDistribution]

[ModelSettings]
number_of_quantum_particles = 1
number_of_timeslices = 30
size_of_particle_space = 1
range_of_initial_particle_positions = 0.0
