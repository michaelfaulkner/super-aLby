[Run]
mediator = event_chain_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[EventChainMediator]
potential = open_quantum_harmonic_oscillator_potential
samplers = mean_squared_position_sampler
minimum_temperature = 1.0
maximum_temperature = 1.0
number_of_temperature_increments = 0
number_of_equilibration_iterations = 10000
number_of_observations = 10000
normalised_distance_between_measurements = 1.666
normalised_distance_between_velocity_refreshments = 1.0

[OpenQuantumHarmonicOscillatorPotential]
mass = 0.8
timestep = 1.5

[MeanSquaredPositionSampler]
output_directory = output/convergence_tests/quantum_harmonic_oscillator_potential/event_chain

[ModelSettings]
number_of_quantum_particles = 1
number_of_timeslices = 30
size_of_particle_space = 1
range_of_initial_particle_positions = 0.0
