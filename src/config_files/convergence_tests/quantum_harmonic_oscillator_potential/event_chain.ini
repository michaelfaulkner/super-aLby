[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = quantum_harmonic_oscillator_potential
samplers = mean_squared_position_sampler
temperature = 1.0
number_of_equilibration_iterations = 10000
number_of_observations = 20000
normalised_distance_between_measurements = 1.666
output_directory = output/convergence_tests/quantum_harmonic_oscillator_potential/event_chain

[QuantumHarmonicOscillatorPotential]
mass = 0.8
timestep = 01.5
omega_squared = 0.64


[StandardPositionSampler]


[ModelSettings]
number_of_quantum_particles = 1
number_of_timeslices = 30
size_of_particle_space = 1
range_of_initial_particle_positions = 0.0
