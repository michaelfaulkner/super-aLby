[Run]
mediator = event_chain_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[EventChainMediator]
potential = quantum_hard_disk_potential
samplers = standard_position_sampler
minimum_temperature = 1.0
maximum_temperature = 1.0
number_of_temperature_increments = 0
number_of_equilibration_iterations = 100
number_of_observations = 1000
normalised_distance_between_measurements = 0.15
normalised_distance_between_velocity_refreshments = 1.0

[QuantumHardDiskPotential]
mass = 0.8
timestep = 1.0
disk_radius = 0.5
packing_fraction = 0.97

[StandardPositionSampler]
output_directory = output/convergence_tests/quantum_hard_disk_potential/event_chain

[ModelSettings]
number_of_timeslices = 2
number_of_quantum_particles = 10
