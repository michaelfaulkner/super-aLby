[Run]
mediator = metropolis_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[MetropolisMediator]
potential = quantum_harmonic_oscillator_potential
samplers = mean_squared_position_sampler, standard_position_sampler
noise_distribution = gaussian_noise_distribution
minimum_temperature = 1.0
maximum_temperature = 1.0
number_of_temperature_increments = 0
number_of_equilibration_iterations = 1000
number_of_observations = 80000
proposal_dynamics_adaptor_is_on = True

[QuantumHarmonicOscillatorPotential]
mass = 1.0
timestep = 1.0

[MeanSquaredPositionSampler]
output_directory = output/convergence_tests/quantum_harmonic_oscillator

[StandardPositionSampler]
output_directory = output/convergence_tests/quantum_harmonic_oscillator

[GaussianNoiseDistribution]

[ModelSettings]
number_of_particles = 100
size_of_particle_space = 1
range_of_initial_particle_positions = 0.0