# Keys (any key can be set in [DEFAULT] for every experiment and overridden in a section):
#   potential                grand_canonical_soft_sphere_potential or grand_canonical_hard_sphere_potential
#   ring_length              L (1D ring)
#   number_of_particles      initial N, calibration N and the target N of the suggested activity
#   temperature
#   range_of_initial_particle_positions  soft disks: initial positions as in super-aLby ModelSettings (a [low, high]
#                            range drawn uniformly, a single float, None, or a file of positions); mapped onto the ring.
#                            The ghost is drawn from the same range.  Hard disks always start on an even lattice.
#   schemes                  production methods, any of: tempered (biased, needs calibration), direct, metropolis
#   log_activity             suggested (optimal: P(N) peaks at number_of_particles) or a number (fixed activity)
#   calibration_bins, calibration_jobs, calibration_observations, sub_bins
#   production_jobs, production_observations, equilibration (equilibration also applies to the calibration)
#   <scheme>_production_observations, <scheme>_equilibration   optional, for one scheme only (tempered_, direct_ or
#                            metropolis_), e.g. tempered_production_observations = 1000000; ECMC observations are
#                            spaced by distance_between_measurements, Metropolis observations are sweeps
# Every key below is required (none has a hidden default); distances are actual particle-displacement distances.
#   distance_between_measurements    ECMC measurement spacing
#   refreshment              uniform or constant (ECMC; Metropolis has none)
#     refreshment_lower_limit, refreshment_upper_limit   uniform: refresh distance drawn from [lower, upper]
#     refreshment_distance   constant: refresh after exactly this distance (e.g. 10e10 = no refreshment,
#                            the default; hard disks need refreshment and override it)
#   parked_length            tempered: length l of the parked interval [-l, 0] of lambda
#   distance_between_coupling_moves  tempered: mean particle displacement between lambda phases
#   mean_coupling_move_length        tempered: mean lambda travel per lambda phase
#   coupled_lifting          tempered: true = ghost-pair events lift between lambda and the particles (both
#                            directions); false = lambda only flips at ghost-pair events
#   redraw_ghost             tempered: redraw the ghost position uniformly when lambda crosses 0 upwards
#   distance_between_direct_moves    direct (ECMC): mean particle displacement between insertion/deletion attempts
#   moves_per_sweep          metropolis: insertion/deletion attempts per sweep
#   noise_width              metropolis: initial width of the single-particle proposal (adapted in equilibration)
#   samplers                 production samplers (required): must include particle_number_sampler, and
#                            ghost_coupling_sampler when tempered is run; Metropolis drops the ghost sampler
#   any other key            a parameter of the potential (e.g. diameter, or epsilon / sigma / power)
#
# Sweeps (optional, in an experiment's section, never in [DEFAULT]), as in run_spawned_configs.sh:
#   sweep                    the key to sweep (any numerical key above, including potential parameters)
#   sweep_start, sweep_end, sweep_increments, sweep_type    sweep_increments + 1 values, linear or log spaced
#   One experiment is written per value, experiments/<name>/<key>_XX/; run_experiment.sh <experiments/<name>> runs
#   (or submits) them all.
#
# Sulis (Slurm):
#   sulis                    true: run_experiment.sh submits the stages as Slurm jobs (run it on Sulis, from src, with
#                            the repository's .venv); false: everything runs locally
#   sulis_account, sulis_partition, sulis_memory_per_cpu     Slurm settings of every job (one CPU per task)
#   sulis_calibration_time, sulis_bias_time, sulis_production_time, sulis_analysis_time   time limit of one task

[DEFAULT]
temperature = 1.0
range_of_initial_particle_positions = [0.0, %(ring_length)s]
schemes = tempered, direct
log_activity = suggested
calibration_bins = 20
calibration_jobs = 4
calibration_observations = 100000
sub_bins = 4
production_jobs = 8
production_observations = 200000
equilibration = 50000
distance_between_measurements = 1.0
refreshment = constant
refreshment_distance = 10e10
parked_length = 1.0
distance_between_coupling_moves = 1.0
mean_coupling_move_length = 1.0
coupled_lifting = true
redraw_ghost = false
distance_between_direct_moves = 1.0
moves_per_sweep = 5
noise_width = 1.0
samplers = particle_number_sampler, ghost_coupling_sampler, potential_sampler
sulis = false
sulis_account = su007-mf
sulis_partition = compute
sulis_memory_per_cpu = 500M
sulis_calibration_time = 04:00:00
sulis_bias_time = 01:00:00
sulis_production_time = 48:00:00
sulis_analysis_time = 02:00:00

[hard_disks_1d_density_0.3]
; 1D hard disks need refreshment (without it the chains only pass the gaps along)
refreshment = uniform
refreshment_lower_limit = 0.0
refreshment_upper_limit = 2.0
potential = grand_canonical_hard_sphere_potential
diameter = 1.0
ring_length = 40.0
number_of_particles = 12

