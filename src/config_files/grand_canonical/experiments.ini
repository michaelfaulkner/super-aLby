# Soft-sphere tuning (18 Nov 2026), kappa = 12, L = 40 as in the paper density sweep (rho sigma = N sigma / L).
# Step 1: calibrate each density once (8 x 20 calibration runs + a short production check):
#   make_experiments.py soft_disks_1d_tuning_calibration_0.8 soft_disks_1d_tuning_calibration_1.0, then
#   run_experiment.sh on each.  Step 2, after both bias.json exist: the sweeps below reuse them via bias_file
#   (submit in the listed order: sulis_max_jobs is cumulative, 50 per sweep, nothing else queued).
# Base settings: compression_split = 0 (only the ghost moves for lambda < 0), c = 0.8, window 8, d = 0.05, m = 2,
