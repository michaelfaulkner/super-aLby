# Hard-disk tuning (18 Nov 2026): one-at-a-time sweeps of the tempered (compression flow) settings around the defaults
# (whole ring, d = 0.05, m = 2, l = 2, refreshment [0, 1]); every sweep contains the default point.  N = 32, L = 32,
# rho sigma = diameter.  The bias is reused from the fixed-N density sweep (generate these on Sulis, where it exists).
# Measurements every 0.01 (not 0.1): at rho sigma 0.9 tau_N was 1 observation at 0.1, i.e. unresolved.
# sulis_max_jobs = 50, 100, ..., 500 (cumulative, in the order below): submitted one after another in that order
# with nothing else queued, each sweep gets 50 jobs, so all ten fit in the 500-job limit together.

