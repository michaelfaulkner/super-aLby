[Run] 
mediator = event_chain_mediator 
number_of_jobs = 1 
max_number_of_cpus = 1 

[EventChainMediator] 
potential = quantum_harmonic_oscillator_potential 
samplers = mean_squared_position_sampler, neighbour_displacement_squared_sampler 
minimum_temperature = 1.0 
maximum_temperature = 1.0 
number_of_temperature_increments = 0 
number_of_equilibration_iterations = 5000 
number_of_observations = 50000 
normalised_distance_between_measurements = 1.0 

[QuantumHarmonicOscillatorPotential] 
mass = 1.0 
timestep = 3.0 
factor_fields = False

[MeanSquaredPositionSampler] 
output_directory = output/qho_neighbour_displacement_b_0_1/3

[NeighbourDisplacementSquaredSampler]
output_directory = output/qho_neighbour_displacement_b_0_1/3


[ModelSettings] 
number_of_quantum_particles = 1 
number_of_timeslices = 40 
size_of_particle_space = 1 
range_of_initial_particle_positions = 0.0 
