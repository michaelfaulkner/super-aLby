[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = harmonic_chain_potential
samplers = structure_factor_sampler
refreshment_distribution = constant_refreshment_distribution
temperature = 1.0
number_of_equilibration_iterations = 5000
number_of_observations = 20000
normalised_distance_between_measurements = 1.0
output_directory = output/harmonic_chain/test_event_chain

[HarmonicChainPotential]
equilibrium_length = 2.0
use_cell_horizon = True

[ConstantRefreshmentDistribution]
normalised_refreshment_distance = 10000000000.0

[StructureFactorSampler]

[ModelSettings]
number_of_particles = 8
size_of_particle_space = 16.0
range_of_initial_particle_positions = [0.0, 16.0]
