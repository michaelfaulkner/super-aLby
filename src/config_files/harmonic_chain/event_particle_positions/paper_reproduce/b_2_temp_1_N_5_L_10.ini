[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = harmonic_chain_potential
samplers = structure_factor_sampler, event_step_sampler, event_active_particle_index_sampler, event_particle_position_sampler
temperature = 1.0
number_of_equilibration_iterations = 1000
number_of_observations = 10000
normalised_distance_between_measurements = 1.0
normalised_distance_between_velocity_refreshments = 1.0

[HarmonicChainPotential]
equilibrium_length = 2.0

[StructureFactorSampler]
output_directory = output/harmonic_chain/event_particle_positions/paper_reproduce/b_2_temp_1_N_5_L_10

[EventStepSampler]
output_directory = output/harmonic_chain/event_particle_positions/paper_reproduce/b_2_temp_1_N_5_L_10

[EventActiveParticleIndexSampler]
output_directory = output/harmonic_chain/event_particle_positions/paper_reproduce/b_2_temp_1_N_5_L_10

[EventParticlePositionSampler]
output_directory = output/harmonic_chain/event_particle_positions/paper_reproduce/b_2_temp_1_N_5_L_10

[ModelSettings]
number_of_particles = 5
size_of_particle_space = 10.0
range_of_initial_particle_positions = [0.0, 10.0]