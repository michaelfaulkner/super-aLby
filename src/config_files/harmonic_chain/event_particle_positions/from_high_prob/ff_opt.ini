[Run]
mediator = event_chain_mediator
number_of_jobs = 1
max_number_of_cpus = 1

[EventChainMediator]
potential = harmonic_chain_potential
factor_field = harmonic_chain_factor_field
samplers = structure_factor_sampler, event_step_sampler, event_particle_position_sampler, event_active_particle_index_sampler
minimum_temperature = 1.0
maximum_temperature = 1.0
number_of_temperature_increments = 0
number_of_equilibration_iterations = 1000
number_of_observations = 10000
normalised_distance_between_measurements = 1.0
normalised_distance_between_velocity_refreshments = 10000.0

[HarmonicChainFactorField]
prefactor = 2.0

[HarmonicChainPotential]
equilibrium_length = 0.0

[StructureFactorSampler]
output_directory = output/harmonic_chain/event_particle_positions/from_high_prob/ff_opt

[EventStepSampler]
output_directory = output/harmonic_chain/event_particle_positions/from_high_prob/ff_opt

[EventParticlePositionSampler]
output_directory = output/harmonic_chain/event_particle_positions/from_high_prob/ff_opt

[EventActiveParticleIndexSampler]
output_directory = output/harmonic_chain/event_particle_positions/from_high_prob/ff_opt

[ModelSettings]
number_of_particles = 4
size_of_particle_space = 8.0
range_of_initial_particle_positions = [0.0, 8.0]