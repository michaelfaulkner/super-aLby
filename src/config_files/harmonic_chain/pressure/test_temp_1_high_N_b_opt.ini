[Run]
mediator = event_chain_mediator

[EventChainMediator]
potential = harmonic_chain_potential
samplers = structure_factor_sampler, spring_length_squared_sampler, event_step_sampler, event_particle_position_sampler, event_active_particle_index_sampler
temperature = 1.0
number_of_equilibration_iterations = 30000
number_of_observations = 100000
normalised_distance_between_measurements = 1.0
normalised_distance_between_velocity_refreshments = 1.0

[HarmonicChainPotential]
equilibrium_length = 2.0

[StructureFactorSampler]
output_directory = output/harmonic_chain/pressure/test_temp_1_high_N

[SpringLengthSquaredSampler]
output_directory = output/harmonic_chain/pressure/test_temp_1_high_N

[EventStepSampler]
output_directory = output/harmonic_chain/pressure/test_temp_1_high_N

[EventParticlePositionSampler]
output_directory = output/harmonic_chain/pressure/test_temp_1_high_N

[EventActiveParticleIndexSampler]
output_directory = output/harmonic_chain/pressure/test_temp_1_high_N

[ModelSettings]
number_of_particles = 64
size_of_particle_space = 128.0
range_of_initial_particle_positions = [0.0, 128.0]