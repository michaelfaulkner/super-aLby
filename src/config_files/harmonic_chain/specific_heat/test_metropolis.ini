[Run]
mediator = metropolis_mediator

[MetropolisMediator]
potential = harmonic_chain_potential
samplers = structure_factor_sampler, potential_sampler
noise_distribution = unbounded_uniform_noise_distribution
temperature = 1.0
number_of_equilibration_iterations = 20000
number_of_observations = 150000
proposal_dynamics_adaptor_is_on = True

[HarmonicChainPotential]
equilibrium_length = 2.0

[StructureFactorSampler]
output_directory = output/harmonic_chain/specific_heat/test_metropolis

[PotentialSampler]
output_directory = output/harmonic_chain/specific_heat/test_metropolis

[UnboundedUniformNoiseDistribution]

[ModelSettings]
number_of_particles = 8
size_of_particle_space = 16.0
range_of_initial_particle_positions = [0.0, 16.0]
